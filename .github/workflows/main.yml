
name: Fetch and Analyze Darono

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0-6"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and analyze Darono
        run: |
          import requests
          import json
          import os
          from datetime import datetime, timezone

          INS_CODE = "34074071043606558"
          BASE = "https://cdn.tsetmc.com/api/"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          def fetch(url):
              response = requests.get(url, headers=headers, timeout=30)
              response.raise_for_status()
              return response.json()

          def number(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except (ValueError, TypeError):
                  return None

          def find_history_rows(obj, found=None):
              if found is None:
                  found = []

              if isinstance(obj, dict):
                  if "pClosing" in obj and "dEven" in obj:
                      price = number(obj.get("pClosing"))
                      if price is not None:
                          found.append(obj)

                  for value in obj.values():
                      find_history_rows(value, found)

              elif isinstance(obj, list):
                  for item in obj:
                      find_history_rows(item, found)

              return found

          def ema(values, period):
              if len(values) < period:
                  return []

              multiplier = 2 / (period + 1)
              result = [sum(values[:period]) / period]

              for value in values[period:]:
                  result.append(
                      (value - result[-1]) * multiplier + result[-1]
                  )

              return result

          def calculate_rsi(values, period=14):
              if len(values) < period + 1:
                  return None

              changes = [
                  values[i] - values[i - 1]
                  for i in range(1, len(values))
              ]

              gains = [max(change, 0) for change in changes]
              losses = [max(-change, 0) for change in changes]

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(changes)):
                  avg_gain = (
                      avg_gain * (period - 1) + gains[i]
                  ) / period

                  avg_loss = (
                      avg_loss * (period - 1) + losses[i]
                  ) / period

              if avg_loss == 0:
                  return 100.0

              rs = avg_gain / avg_loss
              return round(100 - (100 / (1 + rs)), 2)

          def calculate_macd(values):
              if len(values) < 35:
                  return None

              ema12 = ema(values, 12)
              ema26 = ema(values, 26)

              offset = 26 - 12
              macd_line = [
                  ema12[i + offset] - ema26[i]
                  for i in range(len(ema26))
              ]

              signal_line = ema(macd_line, 9)

              if not signal_line:
                  return None

              macd_value = macd_line[-1]
              signal_value = signal_line[-1]

              return {
                  "macd": round(macd_value, 2),
                  "signal": round(signal_value, 2),
                  "histogram": round(macd_value - signal_value, 2),
                  "status": (
                      "مثبت؛ MACD بالاتر از خط سیگنال"
                      if macd_value > signal_value
                      else "منفی؛ MACD پایین‌تر از خط سیگنال"
                  )
              }

          os.makedirs("data", exist_ok=True)

          latest = {
              "insCode": INS_CODE,
              "instrument_name": "دارونو",
              "source": "TSETMC",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          data_errors = []

          try:
              price_data = fetch(
                  BASE + "ClosingPrice/GetClosingPriceInfo/" + INS_CODE
              )

              latest["market_data"] = price_data

          except Exception as error:
              data_errors.append("price_data: " + str(error))
              price_data = {}

          try:
              history_data = fetch(
                  BASE + "ClosingPrice/GetClosingPriceDailyList/"
                  + INS_CODE + "/60"
              )

              rows = find_history_rows(history_data)

              unique_rows = {}
              for row in rows:
                  unique_rows[str(row.get("dEven"))] = row

              rows = list(unique_rows.values())
              rows.sort(key=lambda row: str(row.get("dEven")))

              prices = [
                  number(row.get("pClosing"))
                  for row in rows
              ]

              prices = [value for value in prices if value is not None]

              latest["history_records"] = len(prices)

              analysis = {
                  "history_records": len(prices),
                  "updated_at": latest["updated_at"]
              }

              if len(prices) >= 20:
                  analysis["sma20"] = round(
                      sum(prices[-20:]) / 20, 2
                  )

                  analysis["support_20"] = round(
                      min(prices[-20:]), 2
                  )

                  analysis["resistance_20"] = round(
                      max(prices[-20:]), 2
                  )

              if len(prices) >= 50:
                  analysis["sma50"] = round(
                      sum(prices[-50:]) / 50, 2
                  )

              if len(prices) >= 15:
                  rsi = calculate_rsi(prices)
                  analysis["rsi14"] = rsi

                  if rsi is not None:
                      if rsi >= 70:
                          analysis["rsi_status"] = "اشباع خرید"
                      elif rsi <= 30:
                          analysis["rsi_status"] = "اشباع فروش"
                      else:
                          analysis["rsi_status"] = "محدوده میانی"

              macd = calculate_macd(prices)

              if macd is not None:
                  analysis["macd"] = macd

              if "sma20" in analysis and "sma50" in analysis:
                  if analysis["sma20"] > analysis["sma50"]:
                      analysis["trend"] = "صعودی"
                  elif analysis["sma20"] < analysis["sma50"]:
                      analysis["trend"] = "نزولی"
                  else:
                      analysis["trend"] = "خنثی"

              analysis["entry_status"] = (
                  "نیازمند بررسی و تأیید بیشتر"
              )

              analysis["analysis_notes"] = [
                  "RSI و MACD ابزار کمکی هستند و به‌تنهایی سیگنال خرید نیستند.",
                  "حمایت و مقاومت بر اساس ۲۰ رکورد اخیر محاسبه می‌شوند.",
                  "محاسبات بر اساس قیمت پایانی تاریخچه انجام شده‌اند."
              ]

              with open(
                  "data/analysis.json", "w", encoding="utf-8"
              ) as file:
                  json.dump(
                      analysis, file,
                      ensure_ascii=False, indent=2
                  )

          except Exception as error:
              data_errors.append("history_analysis: " + str(error))

          latest["data_errors"] = data_errors

          with open(
              "data/latest.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  latest, file,
                  ensure_ascii=False, indent=2
              )

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/analysis.json
          git diff --cached --quiet || git commit -m "Update Darono analysis"
          git push
