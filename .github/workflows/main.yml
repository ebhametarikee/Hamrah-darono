name: Hamrah Darono Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0-3,6"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare data folder
        run: mkdir -p data

      - name: Create status file
        run: |
          cat > data/latest.json <<'EOF'
          {
            "app": "Hamrah Darono",
            "fund": "دارونو",
            "status": "monitoring_setup",
            "price": null,
            "nav": null,
            "bubble": null,
            "message": "Waiting for a verified market data source",
            "updated_at": "وقت به‌روزرسانی ثبت نشده"
          }
          EOF

      - name: Save monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update Darono monitoring status" || echo "No changes"
          git push
