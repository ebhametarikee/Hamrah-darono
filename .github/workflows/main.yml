
name: Hamrah Darono - Advanced Analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: darono-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and analyze Darono
        run: |
          python - <<'PY'
          import requests
          import json
          import os
          from datetime import datetime, timezone, date

          INS_CODE = "34074071043606558"
          BASE = "https://cdn.tsetmc.com/api/"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          def fetch(url):
              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )
              response.raise_for_status()
              return response.json()

          def number(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except (ValueError, TypeError):
                  return None

          def find_market_object(obj):
              if isinstance(obj, dict):
                  if (
                      "pClosing" in obj
                      or "pDrCotVal" in obj
                  ):
                      return obj

                  for value in obj.values():
                      result = find_market_object(value)
                      if result is not None:
                          return result

              elif isinstance(obj, list):
                  for item in obj:
                      result = find_market_object(item)
                      if result is not None:
                          return result

              return None

          def find_history_rows(obj, found=None):
              if found is None:
                  found = []

              if isinstance(obj, dict):
                  if "pClosing" in obj and "dEven" in obj:
                      price = number(obj.get("pClosing"))
                      if price is not None and price > 0:
                          found.append(obj)

                  for value in obj.values():
                      find_history_rows(value, found)

              elif isinstance(obj, list):
                  for item in obj:
                      find_history_rows(item, found)

              return found

          def sma(values, period):
              if len(values) < period:
                  return None
              return sum(values[-period:]) / period

          def ema(values, period):
              if len(values) < period:
                  return []

              multiplier = 2 / (period + 1)
              result = [sum(values[:period]) / period]

              for value in values[period:]:
                  result.append(
                      (value - result[-1]) * multiplier
                      + result[-1]
                  )

              return result

          def calculate_rsi(values, period=14):
              if len(values) < period + 1:
                  return None

              changes = [
                  values[i] - values[i - 1]
                  for i in range(1, len(values))
              ]

              gains = [max(x, 0) for x in changes]
              losses = [max(-x, 0) for x in changes]

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(changes)):
                  avg_gain = (
                      avg_gain * (period - 1) + gains[i]
                  ) / period

                  avg_loss = (
                      avg_loss * (period - 1) + losses[i]
                  ) / period

              if avg_loss == 0:
                  return 50.0 if avg_gain == 0 else 100.0

              rs = avg_gain / avg_loss
              return round(100 - (100 / (1 + rs)), 2)

          def calculate_macd(values):
              if len(values) < 35:
                  return None

              ema12 = ema(values, 12)
              ema26 = ema(values, 26)

              offset = 14

              macd_line = [
                  ema12[i + offset] - ema26[i]
                  for i in range(len(ema26))
              ]

              signal_line = ema(macd_line, 9)

              if not signal_line:
                  return None

              macd_value = macd_line[-1]
              signal_value = signal_line[-1]
              histogram = macd_value - signal_value

              if histogram > 0:
                  status = "مثبت"
              elif histogram < 0:
                  status = "منفی"
              else:
                  status = "خنثی"

              return {
                  "macd": round(macd_value, 2),
                  "signal": round(signal_value, 2),
                  "histogram": round(histogram, 2),
                  "status": status
              }

          def save_json(path, data):
              with open(path, "w", encoding="utf-8") as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )

          def parse_market_date(value):
              if not value:
                  return None

              try:
                  value = str(value)[:8]
                  return datetime.strptime(
                      value,
                      "%Y%m%d"
                  ).date()
              except (ValueError, TypeError):
                  return None

          os.makedirs("data", exist_ok=True)

          updated_at = datetime.now(
              timezone.utc
          ).isoformat()

          latest = {
              "insCode": INS_CODE,
              "instrument_name": "دارونو",
              "source": "TSETMC",
              "updated_at": updated_at
          }

          analysis = {
              "updated_at": updated_at,
              "history_records": 0,
              "trend": "نامشخص",
              "entry_status": "داده کافی برای تصمیم‌گیری وجود ندارد",
              "data_quality": "در انتظار بررسی",
              "entry_score": 0
          }

          errors = []

          # دریافت اطلاعات بازار
          try:
              price_data = fetch(
                  BASE
                  + "ClosingPrice/GetClosingPriceInfo/"
                  + INS_CODE
              )

              latest["market_data"] = price_data

              # اصلاح ساختار تو در توی پاسخ TSETMC
              market = find_market_object(price_data)

              if market is None:
                  raise ValueError(
                      "اطلاعات قیمت در پاسخ TSETMC پیدا نشد"
                  )

              latest["last_price"] = number(
                  market.get("pDrCotVal")
              )

              latest["closing_price"] = number(
                  market.get("pClosing")
              )

              latest["volume"] = number(
                  market.get("qTotTran5J")
              )

              latest["trade_value"] = number(
                  market.get("qTotCap")
              )

              latest["price_min"] = number(
                  market.get("priceMin")
              )

              latest["price_max"] = number(
                  market.get("priceMax")
              )

              latest["price_yesterday"] = number(
                  market.get("priceYesterday")
              )

              market_date = (
                  market.get("dEven")
                  or market.get("finalLastDate")
              )

              latest["market_date"] = market_date

          except Exception as error:
              errors.append("price_data: " + str(error))
              market = None

          # دریافت تاریخچه
          try:
              history_data = fetch(
                  BASE
                  + "ClosingPrice/GetClosingPriceDailyList/"
                  + INS_CODE
                  + "/60"
              )

              rows = find_history_rows(history_data)

              unique_rows = {}

              for row in rows:
                  unique_rows[str(row.get("dEven"))] = row

              rows = list(unique_rows.values())

              rows.sort(
                  key=lambda row: str(row.get("dEven"))
              )

              prices = [
                  number(row.get("pClosing"))
                  for row in rows
              ]

              valid_rows = [
                  row for row in rows
                  if number(row.get("pClosing")) is not None
                  and number(row.get("pClosing")) > 0
              ]

              prices = [
                  number(row.get("pClosing"))
                  for row in valid_rows
              ]

              analysis["history_records"] = len(prices)

              if len(prices) < 35:
                  raise ValueError(
                      "حداقل 35 رکورد معتبر برای تحلیل لازم است"
                  )

              analysis["data_quality"] = "تاریخچه دریافت شد"

              # میانگین‌های متحرک
              value20 = sma(prices, 20)
              value50 = sma(prices, 50)

              if value20 is not None:
                  analysis["sma20"] = round(value20, 2)

              if value50 is not None:
                  analysis["sma50"] = round(value50, 2)

              # حمایت و مقاومت
              analysis["support_20"] = round(
                  min(prices[-20:]), 2
              )

              analysis["resistance_20"] = round(
                  max(prices[-20:]), 2
              )

              # روند
              if value20 is not None and value50 is not None:
                  if value20 > value50:
                      analysis["trend"] = "صعودی"
                  elif value20 < value50:
                      analysis["trend"] = "نزولی"
                  else:
                      analysis["trend"] = "خنثی"

              # RSI
              rsi = calculate_rsi(prices)

              if rsi is not None:
                  analysis["rsi14"] = rsi

                  if rsi >= 70:
                      analysis["rsi_status"] = "اشباع خرید"
                  elif rsi <= 30:
                      analysis["rsi_status"] = "اشباع فروش"
                  else:
                      analysis["rsi_status"] = "محدوده میانی"

              # MACD
              macd = calculate_macd(prices)

              if macd is not None:
                  analysis["macd"] = macd

              # حجم معاملات تاریخی
              historical_volumes = []

              for row in valid_rows:
                  volume = number(row.get("qTotTran5J"))

                  if volume is not None and volume > 0:
                      historical_volumes.append({
                          "date": str(row.get("dEven")),
                          "volume": volume
                      })

              # حذف روز جاری از میانگین مقایسه‌ای
              current_market_date = str(
                  latest.get("market_date") or ""
              )

              comparison_volumes = [
                  item["volume"]
                  for item in historical_volumes
                  if item["date"] != current_market_date
              ]

              recent_volumes = comparison_volumes[-20:]

              if recent_volumes:
                  average_volume = (
                      sum(recent_volumes) / len(recent_volumes)
                  )

                  analysis["average_volume_20"] = round(
                      average_volume, 2
                  )

                  current_volume = latest.get("volume")

                  if current_volume is not None and average_volume > 0:
                      volume_ratio = (
                          current_volume / average_volume
                      )

                      analysis["volume_ratio"] = round(
                          volume_ratio, 2
                      )

                      if volume_ratio >= 1.5:
                          analysis["volume_status"] = "بالاتر از میانگین"
                      elif volume_ratio >= 1:
                          analysis["volume_status"] = "نزدیک میانگین"
                      else:
                          analysis["volume_status"] = "پایین‌تر از میانگین"

              # قیمت مبنای تحلیل
              current_price = (
                  latest.get("closing_price")
                  or latest.get("last_price")
              )

              analysis["last_price"] = latest.get("last_price")
              analysis["closing_price"] = latest.get("closing_price")
              analysis["volume"] = latest.get("volume")
              analysis["trade_value"] = latest.get("trade_value")
              analysis["market_date"] = latest.get("market_date")

              if current_price is not None:
                  analysis["current_price"] = current_price

                  if value20:
                      analysis["distance_from_sma20_percent"] = round(
                          ((current_price - value20) / value20) * 100,
                          2
                      )

                  support = analysis["support_20"]
                  resistance = analysis["resistance_20"]

                  if support > 0:
                      analysis["distance_from_support_percent"] = round(
                          ((current_price - support) / support) * 100,
                          2
                      )

                  if current_price > 0:
                      analysis["distance_from_resistance_percent"] = round(
                          ((resistance - current_price) / current_price) * 100,
                          2
                      )

              # بررسی تازگی داده بازار
              parsed_date = parse_market_date(
                  latest.get("market_date")
              )

              if parsed_date:
                  age_days = (
                      datetime.now(timezone.utc).date()
                      - parsed_date
                  ).days

                  analysis["market_data_age_days"] = age_days

                  if age_days <= 4:
                      analysis["market_data_freshness"] = "معتبر"
                  else:
                      analysis["market_data_freshness"] = "قدیمی"
              else:
                  age_days = None
                  analysis["market_data_freshness"] = "نامشخص"

              # امتیازدهی فرصت احتمالی ورود
              score = 0
              reasons = []
              warnings = []

              if analysis["trend"] == "صعودی":
                  score += 25
                  reasons.append("روند میان‌مدت صعودی است")
              elif analysis["trend"] == "نزولی":
                  warnings.append("روند میان‌مدت نزولی است")

              if macd:
                  if macd["histogram"] > 0:
                      score += 20
                      reasons.append("هیستوگرام MACD مثبت است")
                  else:
                      warnings.append("MACD تأیید صعودی نمی‌دهد")

              if rsi is not None:
                  if 45 <= rsi <= 65:
                      score += 15
                      reasons.append("RSI در محدوده مناسب بررسی است")
                  elif 65 < rsi < 70:
                      score += 8
                      warnings.append("RSI به محدوده اشباع خرید نزدیک است")
                  elif rsi >= 70:
                      warnings.append("RSI در محدوده اشباع خرید است")
                  elif rsi < 30:
                      warnings.append("RSI در محدوده اشباع فروش است")
                  else:
                      warnings.append("RSI هنوز تأیید کافی نمی‌دهد")

              if (
                  current_price is not None
                  and value20 is not None
                  and current_price > value20
              ):
                  score += 15
                  reasons.append("قیمت بالاتر از میانگین 20 روزه است")

              volume_ratio = analysis.get("volume_ratio")

              if volume_ratio is not None:
                  if volume_ratio >= 1.5:
                      score += 15
                      reasons.append("حجم معاملات قوی‌تر از میانگین است")
                  elif volume_ratio >= 1:
                      score += 8
                  else:
                      warnings.append("حجم معاملات ضعیف‌تر از میانگین است")

              distance_support = analysis.get(
                  "distance_from_support_percent"
              )

              if (
                  distance_support is not None
                  and 0 <= distance_support <= 3
              ):
                  score += 10
                  reasons.append("قیمت به محدوده حمایت نزدیک است")

              distance_resistance = analysis.get(
                  "distance_from_resistance_percent"
              )

              if (
                  distance_resistance is not None
                  and 0 <= distance_resistance <= 1.5
              ):
                  score = max(0, score - 15)
                  warnings.append("قیمت به مقاومت نزدیک است")

              score = min(100, max(0, score))

              analysis["entry_score"] = score
              analysis["positive_factors"] = reasons
              analysis["risk_warnings"] = warnings

              # جلوگیری از صدور وضعیت ورود با داده قدیمی
              if age_days is None or age_days > 4:
                  entry_status = "داده بازار قدیمی؛ ورود قابل ارزیابی نیست"

              elif score >= 75:
                  entry_status = "آماده بررسی ورود؛ تأیید نهایی لازم است"

              elif score >= 55:
                  entry_status = "مراقبت؛ شرایط ورود در حال شکل‌گیری است"

              else:
                  entry_status = "عدم ورود؛ شرایط کافی فراهم نیست"

              analysis["entry_status"] = entry_status

              analysis["analysis_notes"] = [
                  "امتیاز ورود یک ابزار غربالگری است، نه سیگنال قطعی.",
                  "قیمت پایانی مبنای اصلی محاسبات تکنیکال است.",
                  "حجم معاملات با میانگین روزهای تاریخی مقایسه می‌شود.",
                  "حمایت و مقاومت بر اساس 20 رکورد اخیر هستند.",
                  "تازگی داده بازار در وضعیت ورود لحاظ می‌شود.",
                  "برای تصمیم نهایی، NAV و حباب صندوق نیز باید بررسی شوند."
              ]

          except Exception as error:
              errors.append("history_analysis: " + str(error))
              analysis["data_quality"] = "خطا در دریافت یا تحلیل تاریخچه"
              analysis["analysis_error"] = str(error)
              analysis["entry_status"] = "خطا در تحلیل؛ تصمیم ورود صادر نشد"

          latest["data_errors"] = errors
          analysis["data_errors"] = errors

          save_json("data/latest.json", latest)
          save_json("data/analysis.json", analysis)

          print("Darono Advanced Analysis Completed")
          print("History:", analysis["history_records"])
          print("Last price:", latest.get("last_price"))
          print("Closing price:", latest.get("closing_price"))
          print("Volume:", latest.get("volume"))
          print("Trend:", analysis.get("trend"))
          print("RSI:", analysis.get("rsi14"))
          print("MACD:", analysis.get("macd"))
          print("Entry score:", analysis.get("entry_score"))
          print("Entry status:", analysis.get("entry_status"))
          print("Errors:", errors)

          if errors:
              raise RuntimeError(
                  "برخی از داده‌ها با خطا مواجه شدند"
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/analysis.json
          git diff --cached --quiet || git commit -m "Update Darono advanced analysis"
          git push
