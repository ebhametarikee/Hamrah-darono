
name: Hamrah Darono Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0-3,6"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Darono instrument
        run: |
          python - <<'PY'
          import requests
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          symbol = "دارونو"
          url = "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/" + quote(symbol)

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Referer": "https://www.tsetmc.com/"
          }

          response = requests.get(url, headers=headers, timeout=30)
          response.raise_for_status()
          result = response.json()

          instruments = result.get("instrumentSearch", [])
          matches = [
              item for item in instruments
              if item.get("lVal18AFC", "").strip() == symbol
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  f"Expected one exact match for {symbol}, found {len(matches)}"
              )

          item = matches[0]

          data = {
              "fund": "دارونو",
              "symbol": symbol,
              "insCode": item["insCode"],
              "instrument_name": item.get("lVal30"),
              "status": "instrument_found",
              "source": "TSETMC",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Find Darono instrument code" || echo "No changes"
          git push
