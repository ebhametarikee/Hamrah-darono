
name: Hamrah Darono Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0-3,6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Darono instrument
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.parse import quote
          from datetime import datetime, timezone

          url = "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/" + quote("دارونو")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          items = data.get("instrumentSearch", [])
          matches = [
              x for x in items
              if x.get("lVal18AFC") == "دارونو"
          ]

          if len(matches) != 1:
              raise Exception(f"Expected one Darono match, found {len(matches)}")

          item = matches[0]

          result = {
              "insCode": item["insCode"],
              "instrument_name": item["lVal18AFC"],
              "source": "TSETMC",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          import os
          os.makedirs("data", exist_ok=True)

          with open("data/latest.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Find Darono instrument code" || echo "No changes"
          git push
